<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3a5f">
<title>Porchlight: home inspection reports</title>
<link rel="manifest" href="manifest.json">
<style>
:root{
  --ink:#16202c; --muted:#5d6b7a; --line:#dde3ea; --bg:#f4f6f8; --card:#fff;
  --brand:#1f3a5f; --brand-2:#2f5d8f; --ok:#2e7d4f; --ok-bg:#e5f3ea;
  --warn:#9a6200; --warn-bg:#fdf1db; --bad:#b3261e; --bad-bg:#fbe6e4; --na:#6b7480; --na-bg:#eceff2;
  --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand-2)}
.top{position:sticky;top:0;z-index:5;background:var(--brand);color:#fff;display:flex;align-items:center;gap:10px;padding:12px 14px;padding-top:max(12px,env(safe-area-inset-top))}
.top h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .icon{background:none;border:0;color:#fff;font-size:22px;padding:4px 8px;cursor:pointer;line-height:1}
.wrap{max-width:760px;margin:0 auto;padding:14px 14px 110px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 4px 8px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input[type=text],input[type=email],input[type=tel],input[type=date],input[type=number],select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand-2);outline-offset:0;border-color:transparent}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:12px 16px;background:var(--brand);color:#fff;font-weight:600;cursor:pointer;text-decoration:none}
.btn.ghost{background:#fff;color:var(--brand);border:1px solid var(--line)}
.btn.danger{background:#fff;color:var(--bad);border:1px solid var(--bad-bg)}
.btn.block{width:100%}
.fab{position:fixed;right:18px;bottom:max(18px,env(safe-area-inset-bottom));border-radius:999px;padding:15px 22px;box-shadow:0 6px 20px rgba(20,40,70,.25);z-index:6}
.list-item{display:flex;align-items:center;gap:12px;padding:14px;background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;cursor:pointer;text-decoration:none;color:inherit}
.list-item:active{background:#f7f9fb}
.chev{color:var(--muted);font-size:20px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.na{background:var(--na-bg);color:var(--na)}
.progress{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:8px}
.progress>i{display:block;height:100%;background:var(--ok)}
.item{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
.item-name{font-weight:600;display:flex;gap:8px;align-items:center}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.seg button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 4px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button.on.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.seg button.on.warn{background:#c98200;border-color:#c98200;color:#fff}
.seg button.on.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.seg button.on.na{background:var(--na);border-color:var(--na);color:#fff}
.photos{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.thumb{position:relative;width:78px;height:78px;border-radius:9px;overflow:hidden;background:#e9edf1}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:13px;line-height:22px;padding:0;cursor:pointer}
.addphoto{width:78px;height:78px;border:1.5px dashed #b9c3ce;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);font-size:12px;cursor:pointer;background:#fafbfc}
.addphoto b{font-size:22px;line-height:1}
.addphoto input{display:none}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.quick button{border:1px solid var(--line);background:#f7f9fb;border-radius:99px;padding:5px 10px;font-size:12px;cursor:pointer;color:var(--muted)}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty .big{font-size:44px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#16202c;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat{border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px}
.addrow{display:flex;gap:8px;margin-top:6px}
.addrow input{flex:1}

/* ---------- Report ---------- */
.report{background:#fff;max-width:820px;margin:0 auto;padding:36px 40px;color:#111}
.report .r-head{display:flex;justify-content:space-between;gap:20px;border-bottom:3px solid var(--brand);padding-bottom:16px}
.report .r-logo{max-height:64px;max-width:200px}
.report h1{font-size:26px;margin:0 0 4px;color:var(--brand)}
.report h3{font-size:18px;margin:26px 0 8px;color:var(--brand);border-bottom:1px solid var(--line);padding-bottom:6px;break-after:avoid}
.report table{width:100%;border-collapse:collapse;font-size:14px}
.report td{padding:5px 8px;border-bottom:1px solid #eef1f4;vertical-align:top}
.report td.k{color:var(--muted);width:34%}
.report .ri{padding:9px 0;border-bottom:1px solid #eef1f4;break-inside:avoid}
.report .ri .h{display:flex;justify-content:space-between;gap:10px;font-weight:600}
.report .ri p{margin:4px 0 0;white-space:pre-wrap}
.report .rphotos{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.report .rphotos img{width:31%;min-width:150px;border-radius:6px;border:1px solid var(--line)}
.report .sum{border:1px solid var(--line);border-radius:10px;padding:4px 14px;margin-top:10px}
.report .disc{font-size:11.5px;color:var(--muted);margin-top:30px;white-space:pre-wrap;border-top:1px solid var(--line);padding-top:12px}
.report .ri .h .pill{align-self:flex-start}
@media(max-width:600px){.report{padding:20px 16px}.report .r-head{flex-direction:column}.report .r-head>div:last-child{text-align:left!important}}
.report-bar{position:sticky;top:0;z-index:5;display:flex;gap:8px;justify-content:center;padding:10px;background:var(--brand)}
@media print{
  @page{size:letter;margin:14mm}
  body{background:#fff}
  .report-bar,.top,.fab,.toast{display:none!important}
  .report{padding:0;max-width:none}
  .report .rphotos img{width:31%;min-width:0}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ================= Storage (IndexedDB) ================= */
const DB_NAME='porchlight', DB_VER=1;
let dbp=null;
function db(){
  if(dbp) return dbp;
  dbp=new Promise((res,rej)=>{
    const r=indexedDB.open(DB_NAME,DB_VER);
    r.onupgradeneeded=()=>{const d=r.result;
      d.createObjectStore('inspections',{keyPath:'id'});
      d.createObjectStore('photos',{keyPath:'id'});
      d.createObjectStore('kv');};
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
  return dbp;
}
async function tx(store,mode,fn){
  const d=await db();
  return new Promise((res,rej)=>{
    const t=d.transaction(store,mode), s=t.objectStore(store);
    const out=fn(s); t.oncomplete=()=>res(out&&out.result!==undefined?out.result:out); t.onerror=()=>rej(t.error);
  });
}
const store={
  all:()=>tx('inspections','readonly',s=>s.getAll()),
  get:id=>tx('inspections','readonly',s=>s.get(id)),
  put:o=>tx('inspections','readwrite',s=>s.put(o)),
  del:id=>tx('inspections','readwrite',s=>s.delete(id)),
  photo:id=>tx('photos','readonly',s=>s.get(id)),
  putPhoto:o=>tx('photos','readwrite',s=>s.put(o)),
  delPhoto:id=>tx('photos','readwrite',s=>s.delete(id)),
  kv:k=>tx('kv','readonly',s=>s.get(k)),
  setKv:(k,v)=>tx('kv','readwrite',s=>s.put(v,k)),
};

/* ================= Template ================= */
const TEMPLATE=[
 ['Grounds & Exterior',['Grading & drainage','Driveway & walkways','Siding / exterior walls','Exterior trim & caulking','Windows (exterior)','Exterior doors','Decks, porches & steps','Railings','Fences & retaining walls','Vegetation near structure']],
 ['Roof',['Roof covering','Flashing','Gutters & downspouts','Chimney','Skylights & penetrations','Roof ventilation']],
 ['Structure & Foundation',['Foundation walls','Floor structure','Visible framing','Evidence of water intrusion','Cracks / settlement']],
 ['Electrical',['Service entrance & meter','Main panel','Breakers / fuses','Grounding & bonding','Visible wiring','Outlets & switches (sample)','GFCI / AFCI protection','Smoke & CO alarms']],
 ['Plumbing',['Main water shut-off','Supply piping','Drain & waste piping','Water pressure & flow','Water heater','Sump pump','Fixtures & faucets']],
 ['Heating & Cooling',['Furnace / boiler','Air conditioning / heat pump','Ductwork & vents','Thermostat','Filter condition','Venting / flue']],
 ['Interior',['Walls & ceilings','Floors','Stairs & handrails','Interior doors','Windows (interior)','Fireplace / wood stove']],
 ['Kitchen',['Cabinets & counters','Sink & disposal','Range / cooktop','Range hood / exhaust','Dishwasher','Refrigerator']],
 ['Bathrooms',['Toilets','Sinks & vanities','Tub / shower','Tile & caulking','Exhaust fans']],
 ['Attic & Insulation',['Attic access','Insulation','Ventilation','Evidence of leaks / moisture','Vapour barrier']],
 ['Basement & Crawlspace',['Basement walls & floor','Moisture / efflorescence','Crawlspace access & condition']],
 ['Garage',['Garage door & opener','Auto-reverse safety','Fire separation door','Garage floor']],
];
const QUICK={
  warn:['Monitor','Recommend further evaluation','Near end of service life','Maintenance needed','Minor damage noted'],
  bad:['Recommend repair by a qualified contractor','Safety hazard: correct promptly','Active leak observed','Missing / not installed','Not functioning at time of inspection'],
};
const STATUS={ok:'Satisfactory',warn:'Marginal',bad:'Defect',na:'N/A'};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const DEFAULT_SETTINGS={company:'',inspector:'',license:'',phone:'',email:'',logo:'',
  disclaimer:'This report is a visual, non-invasive inspection of readily accessible areas on the date of inspection. It is not a guarantee or warranty of the condition of the property, and it does not cover concealed or latent defects. Items noted as defects or marginal should be evaluated and corrected by qualified, licensed professionals before closing.'};

function newInspection(){
  return {id:uid(),created:Date.now(),updated:Date.now(),
    property:{address:'',city:'',client:'',clientEmail:'',date:new Date().toISOString().slice(0,10),time:'',type:'Single-family',year:'',sqft:'',weather:'',occupied:'Occupied',present:''},
    summary:'',
    sections:TEMPLATE.map(([name,items])=>({id:uid(),name,items:items.map(n=>({id:uid(),name:n,status:'',note:'',photos:[]}))}))};
}

/* ================= Helpers ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1600)}
function counts(insp){const c={ok:0,warn:0,bad:0,na:0,todo:0,total:0};
  insp.sections.forEach(s=>s.items.forEach(i=>{c.total++; i.status?c[i.status]++:c.todo++;})); return c;}
function secCounts(s){const c={ok:0,warn:0,bad:0,na:0,todo:0};s.items.forEach(i=>i.status?c[i.status]++:c.todo++);return c;}
function fmtDate(d){if(!d)return'';const x=new Date(d+'T12:00');return x.toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'})}
let saveTimer=null, current=null;
function saveSoon(){if(!current)return;current.updated=Date.now();clearTimeout(saveTimer);saveTimer=setTimeout(()=>store.put(current),350)}
async function settings(){return Object.assign({},DEFAULT_SETTINGS,(await store.kv('settings'))||{})}

function compress(file,max=1400,q=.72){
  return new Promise((res,rej)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{let {width:w,height:h}=img; const k=Math.min(1,max/Math.max(w,h)); w=Math.round(w*k);h=Math.round(h*k);
      const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',q));};
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Could not read image'))};
    img.src=url;
  });
}
const photoCache=new Map();
async function photoURL(id){if(photoCache.has(id))return photoCache.get(id);const p=await store.photo(id);const u=p?p.data:'';photoCache.set(id,u);return u}

/* ================= Router ================= */
window.addEventListener('hashchange',route);
async function route(){
  const h=location.hash.slice(1)||'/'; const p=h.split('/').filter(Boolean);
  window.scrollTo(0,0);
  if(p[0]==='settings') return viewSettings();
  if(p[0]==='i'){
    if(!current||current.id!==p[1]) current=await store.get(p[1]);
    if(!current){location.hash='#/';return}
    if(p[2]==='s') return viewSection(p[3]);
    if(p[2]==='report') return viewReport();
    if(p[2]==='details') return viewDetails();
    return viewInspection();
  }
  current=null; return viewHome();
}
function bar(title,back,right=''){
  return `<div class="top">${back?`<button class="icon" onclick="location.hash='${back}'" aria-label="Back">‹</button>`:''}<h1>${esc(title)}</h1>${right}</div>`;
}

/* ================= Views ================= */
async function viewHome(){
  const list=(await store.all()).sort((a,b)=>b.updated-a.updated);
  const st=await settings();
  $('#app').innerHTML=bar('Porchlight',null,`<button class="icon" onclick="location.hash='#/settings'" aria-label="Settings">⚙</button>`)+
  `<div class="wrap">
    ${!st.company?`<div class="card" style="background:#eef4fb;border-color:#cfe0f3"><b>First time?</b> <span class="muted">Add your company name, licence and logo so they appear on every report.</span><div style="margin-top:10px"><a class="btn ghost" href="#/settings">Set up my company</a></div></div>`:''}
    ${list.length?`<h2>Inspections</h2>`+list.map(i=>{const c=counts(i);const pct=Math.round((c.total-c.todo)/c.total*100);
      return `<a class="list-item" href="#/i/${i.id}"><div class="grow">
        <div style="font-weight:600">${esc(i.property.address||'Untitled inspection')}</div>
        <div class="muted small">${esc([i.property.client,fmtDate(i.property.date)].filter(Boolean).join(' · '))}</div>
        <div class="progress"><i style="width:${pct}%"></i></div>
        <div class="small muted" style="margin-top:6px">${pct}% complete ${c.bad?`· <span class="pill bad">${c.bad} defect${c.bad>1?'s':''}</span>`:''} ${c.warn?`<span class="pill warn">${c.warn} marginal</span>`:''}</div>
      </div><span class="chev">›</span></a>`}).join(''):
    `<div class="empty"><div class="big">🏠</div><p><b>No inspections yet</b></p><p>Tap <b>New inspection</b> to start a room-by-room checklist with photos. Your finished report is a clean PDF for your client.</p></div>`}
  </div>
  <button class="btn fab" onclick="createInspection()">＋ New inspection</button>`;
}
async function createInspection(){const i=newInspection();await store.put(i);current=i;location.hash=`#/i/${i.id}/details`}

function viewInspection(){
  const i=current,c=counts(i);
  $('#app').innerHTML=bar(i.property.address||'Inspection','#/',`<button class="icon" onclick="location.hash='#/i/${i.id}/report'" aria-label="Report">📄</button>`)+
  `<div class="wrap">
    <div class="card">
      <div class="row"><div class="grow"><div style="font-weight:700;font-size:18px">${esc(i.property.address||'Untitled inspection')}</div>
      <div class="muted small">${esc([i.property.city,i.property.client,fmtDate(i.property.date)].filter(Boolean).join(' · '))}</div></div>
      <a class="btn ghost" href="#/i/${i.id}/details">Edit</a></div>
      <div class="stats">
        <div class="stat" style="background:var(--bad-bg);color:var(--bad)"><b>${c.bad}</b>Defects</div>
        <div class="stat" style="background:var(--warn-bg);color:var(--warn)"><b>${c.warn}</b>Marginal</div>
        <div class="stat" style="background:var(--na-bg);color:var(--na)"><b>${c.todo}</b>To do</div>
      </div>
    </div>
    <h2>Sections</h2>
    ${i.sections.map(s=>{const sc=secCounts(s);const done=s.items.length-sc.todo;
      return `<a class="list-item" href="#/i/${i.id}/s/${s.id}"><div class="grow"><div style="font-weight:600">${esc(s.name)}</div>
      <div class="small muted">${done}/${s.items.length} checked ${sc.bad?`· <span class="pill bad">${sc.bad} defect${sc.bad>1?'s':''}</span>`:''} ${sc.warn?`<span class="pill warn">${sc.warn} marginal</span>`:''}</div></div><span class="chev">›</span></a>`}).join('')}
    <div class="addrow"><input type="text" id="newsec" placeholder="Add a section (e.g. Pool, Outbuilding)"><button class="btn ghost" onclick="addSection()">Add</button></div>
    <h2>Summary for client</h2>
    <div class="card"><textarea id="summary" placeholder="Overall impressions, top priorities, anything the buyer should know first.">${esc(i.summary)}</textarea></div>
    <a class="btn block" href="#/i/${i.id}/report">📄 Preview &amp; save report as PDF</a>
    <div style="margin-top:28px;text-align:center"><button class="btn danger" onclick="deleteInspection()">Delete inspection</button></div>
  </div>`;
  $('#summary').oninput=e=>{i.summary=e.target.value;saveSoon()};
}
function addSection(){const v=$('#newsec').value.trim();if(!v)return;current.sections.push({id:uid(),name:v,items:[]});saveSoon();viewInspection()}
async function deleteInspection(){
  if(!confirmInline('Delete this inspection and its photos? This cannot be undone.'))return;
  for(const s of current.sections)for(const it of s.items)for(const p of it.photos)await store.delPhoto(p);
  await store.del(current.id);current=null;location.hash='#/';toast('Inspection deleted');
}
function confirmInline(msg){return window.confirm(msg)}

function viewDetails(){
  const p=current.property;
  const f=(k,l,t='text',ph='')=>`<label for="f_${k}">${l}</label><input id="f_${k}" type="${t}" value="${esc(p[k])}" placeholder="${ph}" data-k="${k}">`;
  const sel=(k,l,opts)=>`<label for="f_${k}">${l}</label><select id="f_${k}" data-k="${k}">${opts.map(o=>`<option ${o===p[k]?'selected':''}>${o}</option>`).join('')}</select>`;
  $('#app').innerHTML=bar('Property details',`#/i/${current.id}`)+
  `<div class="wrap"><div class="card">
    ${f('address','Property address','text','123 Main St')}
    <div class="grid2">${f('city','City / town')}${f('date','Inspection date','date')}</div>
    <div class="grid2">${f('client','Client name')}${f('clientEmail','Client email','email')}</div>
    <div class="grid2">${sel('type','Property type',['Single-family','Semi-detached','Townhouse','Condo / apartment','Multi-unit','Mobile home','Other'])}${f('year','Year built','number','1985')}</div>
    <div class="grid2">${f('sqft','Approx. size (sq ft)','number')}${f('weather','Weather','text','Clear, 4°C')}</div>
    <div class="grid2">${sel('occupied','Occupancy',['Occupied','Vacant','Partially furnished'])}${f('present','Present at inspection','text','Buyer, agent')}</div>
  </div>
  <a class="btn block" href="#/i/${current.id}">Start checklist ›</a></div>`;
  document.querySelectorAll('[data-k]').forEach(el=>el.addEventListener('input',e=>{p[e.target.dataset.k]=e.target.value;saveSoon()}));
}

async function viewSection(sid){
  const s=current.sections.find(x=>x.id===sid); if(!s){location.hash=`#/i/${current.id}`;return}
  const idx=current.sections.indexOf(s), next=current.sections[idx+1];
  $('#app').innerHTML=bar(s.name,`#/i/${current.id}`)+
  `<div class="wrap">
    <div class="row small muted" style="margin:0 4px 10px"><div class="grow">Tap a rating for each item. Add notes and photos for anything not satisfactory.</div>
      <button class="btn ghost" style="padding:7px 10px;font-size:13px" onclick="markRestOk('${s.id}')">Mark rest OK</button></div>
    <div id="items"></div>
    <div class="addrow"><input type="text" id="newitem" placeholder="Add an item to this section"><button class="btn ghost" onclick="addItem('${s.id}')">Add</button></div>
    <div style="margin-top:18px">${next?`<a class="btn block" href="#/i/${current.id}/s/${next.id}">Next: ${esc(next.name)} ›</a>`:`<a class="btn block" href="#/i/${current.id}/report">All sections done: preview report ›</a>`}</div>
  </div>`;
  const box=$('#items');
  for(const it of s.items){box.appendChild(await itemEl(s,it))}
}
async function itemEl(s,it){
  const d=document.createElement('div');d.className='item';
  const render=async()=>{
    const thumbs=await Promise.all(it.photos.map(async p=>`<div class="thumb"><img src="${await photoURL(p)}" alt=""><button data-del="${p}" aria-label="Remove photo">✕</button></div>`));
    d.innerHTML=`<div class="item-name"><span class="grow">${esc(it.name)}</span>${it.status?`<span class="pill ${it.status}">${STATUS[it.status]}</span>`:''}</div>
    <div class="seg">${Object.keys(STATUS).map(k=>`<button class="${k} ${it.status===k?'on':''}" data-st="${k}">${STATUS[k]}</button>`).join('')}</div>
    ${it.status&&it.status!=='ok'&&it.status!=='na'||it.note||it.photos.length?`
      <textarea placeholder="What did you observe? Location, extent, recommendation.">${esc(it.note)}</textarea>
      ${QUICK[it.status]?`<div class="quick">${QUICK[it.status].map(q=>`<button data-q="${esc(q)}">+ ${esc(q)}</button>`).join('')}</div>`:''}
      <div class="photos">${thumbs.join('')}<label class="addphoto"><b>＋</b>Photo<input type="file" accept="image/*" capture="environment" multiple></label></div>`
    :`<div class="small muted" style="margin-top:8px"><a href="#" data-more>Add note or photo</a></div>`}`;
    d.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{it.status=it.status===b.dataset.st?'':b.dataset.st;saveSoon();render()});
    const ta=d.querySelector('textarea'); if(ta) ta.oninput=e=>{it.note=e.target.value;saveSoon()};
    d.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{it.note=(it.note?it.note.trim()+' ':'')+b.dataset.q+'.';saveSoon();render()});
    const more=d.querySelector('[data-more]'); if(more) more.onclick=e=>{e.preventDefault();it.note=it.note||' ';render().then(()=>{it.note=it.note.trim();d.querySelector('textarea')?.focus()})};
    const fi=d.querySelector('input[type=file]');
    if(fi) fi.onchange=async e=>{
      for(const f of e.target.files){try{const data=await compress(f);const id=uid();await store.putPhoto({id,data});photoCache.set(id,data);it.photos.push(id)}catch(err){toast(err.message)}}
      saveSoon();render();
    };
    d.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{const id=b.dataset.del;it.photos=it.photos.filter(x=>x!==id);await store.delPhoto(id);photoCache.delete(id);saveSoon();render()});
  };
  await render(); return d;
}
function addItem(sid){const v=$('#newitem').value.trim();if(!v)return;current.sections.find(s=>s.id===sid).items.push({id:uid(),name:v,status:'',note:'',photos:[]});saveSoon();viewSection(sid)}
function markRestOk(sid){const s=current.sections.find(x=>x.id===sid);let n=0;s.items.forEach(i=>{if(!i.status){i.status='ok';n++}});saveSoon();viewSection(sid);toast(n?`${n} item${n>1?'s':''} marked Satisfactory`:'Nothing left to mark')}

async function viewReport(){
  const i=current,p=i.property,st=await settings(),c=counts(i);
  const flagged=[];i.sections.forEach(s=>s.items.forEach(it=>{if(it.status==='bad'||it.status==='warn')flagged.push({s,it})}));
  flagged.sort((a,b)=>(a.it.status==='bad'?0:1)-(b.it.status==='bad'?0:1));
  const ph=async ids=>ids.length?`<div class="rphotos">${(await Promise.all(ids.map(photoURL))).map(u=>`<img src="${u}" alt="">`).join('')}</div>`:'';
  let body='';
  for(const s of i.sections){
    const rated=s.items.filter(it=>it.status||it.note||it.photos.length); if(!rated.length)continue;
    body+=`<h3>${esc(s.name)}</h3>`;
    for(const it of rated){body+=`<div class="ri"><div class="h"><span>${esc(it.name)}</span>${it.status?`<span class="pill ${it.status}">${STATUS[it.status]}</span>`:''}</div>${it.note.trim()?`<p>${esc(it.note.trim())}</p>`:''}${await ph(it.photos)}</div>`}
  }
  $('#app').innerHTML=`<div class="report-bar"><button class="btn ghost" onclick="location.hash='#/i/${i.id}'">‹ Back</button><button class="btn" style="background:#fff;color:var(--brand)" onclick="window.print()">Save as PDF / Print</button></div>
  <div class="report">
    <div class="r-head"><div><h1>Home Inspection Report</h1>
      <div style="font-size:18px;font-weight:600">${esc(p.address||'')}</div><div class="muted">${esc(p.city||'')}</div></div>
      <div style="text-align:right">${st.logo?`<img class="r-logo" src="${st.logo}" alt=""><br>`:''}<b>${esc(st.company)}</b>
      <div class="small muted">${esc([st.inspector,st.license&&('Licence '+st.license),st.phone,st.email].filter(Boolean).join('\n')).replace(/\n/g,'<br>')}</div></div></div>
    <h3>Inspection details</h3>
    <table>${[['Client',p.client],['Inspection date',fmtDate(p.date)],['Property type',p.type],['Year built',p.year],['Approx. size',p.sqft&&p.sqft+' sq ft'],['Weather',p.weather],['Occupancy',p.occupied],['Present',p.present]].filter(r=>r[1]).map(r=>`<tr><td class="k">${r[0]}</td><td>${esc(r[1])}</td></tr>`).join('')}</table>
    <h3>Summary</h3>
    <div class="row" style="gap:8px;flex-wrap:wrap"><span class="pill bad">${c.bad} defect${c.bad===1?'':'s'}</span><span class="pill warn">${c.warn} marginal</span><span class="pill ok">${c.ok} satisfactory</span>${c.na?`<span class="pill na">${c.na} not applicable</span>`:''}</div>
    ${i.summary.trim()?`<p style="white-space:pre-wrap">${esc(i.summary.trim())}</p>`:''}
    ${flagged.length?`<div class="sum">${flagged.map(({s,it})=>`<div class="ri"><div class="h"><span>${esc(s.name)}: ${esc(it.name)}</span><span class="pill ${it.status}">${STATUS[it.status]}</span></div>${it.note.trim()?`<p>${esc(it.note.trim())}</p>`:''}</div>`).join('')}</div>`:'<p class="muted">No defects or marginal items were recorded.</p>'}
    ${body}
    <div class="disc"><b>Scope and limitations.</b> ${esc(st.disclaimer)}</div>
  </div>`;
  document.title=`Inspection Report - ${p.address||'Property'}`;
}

async function viewSettings(){
  const st=await settings();
  const f=(k,l,t='text')=>`<label for="s_${k}">${l}</label><input id="s_${k}" type="${t}" value="${esc(st[k])}" data-s="${k}">`;
  $('#app').innerHTML=bar('Company & report settings','#/')+
  `<div class="wrap"><div class="card">
    ${f('company','Company name')}
    <div class="grid2">${f('inspector','Inspector name')}${f('license','Licence / certification #')}</div>
    <div class="grid2">${f('phone','Phone','tel')}${f('email','Email','email')}</div>
    <label>Logo (shown on reports)</label>
    <div class="row">${st.logo?`<img src="${st.logo}" style="max-height:48px;max-width:140px">`:'<span class="muted small">No logo</span>'}
      <label class="btn ghost" style="margin:0">Choose image<input type="file" accept="image/*" id="logo" style="display:none"></label>
      ${st.logo?`<button class="btn danger" id="rmlogo">Remove</button>`:''}</div>
    <label for="s_disclaimer">Report disclaimer</label><textarea id="s_disclaimer" data-s="disclaimer" style="min-height:130px">${esc(st.disclaimer)}</textarea>
  </div>
  <div class="card small muted">Everything is stored on this device only. Nothing is uploaded anywhere. Clearing your browser data will erase inspections, so save finished reports as PDFs.</div>
  </div>`;
  document.querySelectorAll('[data-s]').forEach(el=>el.addEventListener('input',async e=>{const s=await settings();s[e.target.dataset.s]=e.target.value;await store.setKv('settings',s)}));
  $('#logo').onchange=async e=>{const file=e.target.files[0];if(!file)return;const s=await settings();s.logo=await compress(file,500,.85);await store.setKv('settings',s);viewSettings();toast('Logo saved')};
  const rm=$('#rmlogo'); if(rm) rm.onclick=async()=>{const s=await settings();s.logo='';await store.setKv('settings',s);viewSettings()};
}

if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
route();
</script>
</body>
</html>
